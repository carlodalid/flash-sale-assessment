services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
      POSTGRES_DB: flash_sale
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the separate test database on first boot.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash -d flash_sale"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    # AOF with fsync every second: accepted-but-not-yet-persisted purchases live in
    # Redis, so we trade at most ~1s of exposure for throughput. See README.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Only started by `pnpm stress`, never by `docker compose up`.
  k6:
    image: grafana/k6:1.0.0
    profiles: ["stress"]
    volumes:
      - ./stress:/stress:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BASE_URL: ${STRESS_BASE_URL:-http://host.docker.internal:3000}

volumes:
  postgres-data:
  redis-data:
